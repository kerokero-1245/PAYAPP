# main と PR で lint・テスト・本番ビルドを回し、壊れた変更が main に入る（＝ Vercel に出る）のを防ぐ。
name: CI（lint・テスト・ビルド）

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node を .nvmrc の版で用意
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: 整形の検査（Prettier）
        run: npm run format:check

      - name: lint
        run: npm run lint

      # next typegen が Next 16 のルートの型（PageProps・LayoutProps など。.next/types は git に入れていない）を作り、
      # tsc が app・components・lib・store・scripts・tests の型を検査する（本番ビルドの型検査には tests と scripts が入らない）。
      - name: 型の検査
        run: |
          npx next typegen
          npx tsc --noEmit

      # 部品の CSS に結合子・入れ子・!important を、ページに Tailwind の ! 接尾辞・group-hover・space-y・任意値を
      # 持ち込んでいないか（scripts/check-flat-css.mjs）
      - name: 平坦な CSS の検査
        run: npm run check:css

      # GraphQL の型（lib/graphql/__generated__）は生成物をコミットしている。
      # SDL（lib/graphql/sdl.ts）を変えて npm run codegen を忘れたら、ここで落とす。
      - name: GraphQL の生成物が最新か
        run: |
          npm run codegen
          git diff --exit-code -- lib/graphql/__generated__
          test -z "$(git status --porcelain -- lib/graphql/__generated__)"

      - name: テスト
        run: npm test

      # Stripe のキーはリクエスト時にだけ読む（lib/stripe.js の getStripe）ので、ビルドに環境変数は要らない。
      - name: 本番ビルド
        run: npm run build

  # 本番ビルドした next start に、ブラウザ（Playwright の Chromium）で画面を操作して通す E2E。
  # 上の job とは needs で結ばず並列に回す（落ちたときに「lint・テスト」か「E2E」かが job 名で分かる）。
  # Stripe のキーは使わない（secrets を参照しない）。Stripe に向かう通信はテストの中でモックし、
  # サーバも STRIPE_SECRET_KEY を空にして Stripe から切り離している。実際の Stripe に通信する @stripe のテストは、
  # キーと E2E_STRIPE=1 が無いと skip になる。
  e2e:
    name: E2E（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node を .nvmrc の版で用意
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存をインストール
        run: npm ci

      # ブラウザのビルドは Playwright の版に結び付く（package.json は完全一致で固定）ので、版をキャッシュのキーにする。
      - name: Playwright の版を読む
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright のブラウザをキャッシュ
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: ブラウザを入れる（キャッシュが無いとき）
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # キャッシュにはブラウザ本体だけが入る。OS のライブラリ（apt）は毎回入れる。
      - name: ブラウザの依存だけ入れる（キャッシュがあるとき）
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 本番ビルド
        run: npm run build

      # ビルドは上の工程で済んでいる。npm run test:e2e は build してから回すので、ここでは使わない（ビルドが 2 回になる）。
      - name: E2E
        run: npx playwright test

      # 落ちたときの調査用（HTML レポート・失敗時のスクリーンショット・retry したテストの trace）。
      # 通ったときも上げる（retry で通った flaky をレポートで見られるように）。
      - name: レポートを保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # DB のマイグレーション（drizzle/ の SQL）が、スキーマ（lib/db/schema.ts）から作り直した結果と同じか。
  # スキーマを変えて npm run db:generate を忘れたら、ここで落とす（GraphQL の生成物の鮮度と同じ形）。
  # generate は DB に繋がない。Secrets も使わない。
  db-migrations-fresh:
    name: マイグレーションが最新か
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node を .nvmrc の版で用意
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: generate を打って差分が出ないこと
        run: |
          npx drizzle-kit generate
          git diff --exit-code -- drizzle
          test -z "$(git status --porcelain -- drizzle)"

  # 本物の Postgres に、全マイグレーションを drizzle-kit migrate で当てる。
  # npm test は PGlite（WASM の Postgres）にマイグレーションを当てるので、本物との差（版・DDL の細かな挙動）をここで拾う。
  # Postgres は services のコンテナなので Secrets は使わない（下の接続文字列はこのジョブの中のコンテナ専用）。
  # 17 は本番の想定、18 は PGlite が載せている版。
  #
  # drizzle-kit が素の Postgres に TCP で繋ぐには pg（か postgres）のドライバが要る。
  # 入っていないと @neondatabase/serverless を使い、これは WebSocket のプロキシ越しに Neon へ繋ぐものなので localhost の Postgres には繋がらない。
  # アプリは pg を使わないので、依存には入れず、このジョブの中だけで入れる（package.json と package-lock.json は変わらない）。
  db-migrate-postgres:
    name: マイグレーションの適用（Postgres ${{ matrix.postgres }}）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/payapp
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node を .nvmrc の版で用意
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: Postgres に繋ぐドライバ（pg）をこのジョブにだけ入れる
        run: npm install --no-save pg@8.23.0

      - name: マイグレーションを当てる
        run: npx drizzle-kit migrate

      - name: もう一度当てても何も起きない
        run: npx drizzle-kit migrate

      - name: 8 つの表（注文の 4 つと認証の 4 つ）ができている
        run: |
          node -e '
            const { Client } = require("pg");
            (async () => {
              const client = new Client({ connectionString: process.env.DATABASE_URL_UNPOOLED });
              await client.connect();
              const { rows } = await client.query("select table_name from information_schema.tables where table_schema = $1", ["public"]);
              await client.end();
              const tables = rows.map((row) => row.table_name).sort().join(",");
              if (tables !== "account,order_items,orders,products,session,stripe_events,user,verification") throw new Error("表が違います: " + tables);
              console.log("OK: " + tables);
            })().catch((error) => { console.error(error); process.exit(1); });
          '

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチの新しい push で古い実行をキャンセルし、無駄なコストを削る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # ビルド時に参照される公開値のプレースホルダ。
          # 実際の値・秘匿値の注入は集約側の CD 実装で行う。
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
